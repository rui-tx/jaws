<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Reusable breadcrumb bar -->
    <div th:fragment="breadcrumb(parentText, parentUrl, currentText, actions)">
        <section class="bg-white border-b border-gray-200 px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <nav class="flex" aria-label="Breadcrumb">
                        <ol class="flex items-center space-x-2">
                            <li th:if="${parentUrl != null}">
                                <a th:href="${parentUrl}" class="text-sm font-medium text-primary-600 hover:underline" th:text="${parentText}">Parent</a>
                            </li>
                            <li th:if="${parentUrl != null}"><span class="text-gray-400">/</span></li>
                            <li><span class="text-sm text-gray-500" th:text="${currentText}">Current</span></li>
                        </ol>
                    </nav>
                </div>
                <!-- Optional actions slot -->
                <div th:if="${actions}">
                    <th:block th:replace="${actions}"></th:block>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
