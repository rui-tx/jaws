<!DOCTYPE html>
<html layout:decorate="~{backoffice/layouts/base.html}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>User Detail</title>
</head>
<body>
<section layout:fragment="content">
  <div class="space-y-6">
    <!-- Error State -->
    <div class="card" th:if="${data.error != null}">
      <header>
        <h1 class="text-2xl font-bold text-destructive">User Not Found</h1>
      </header>
      <section>
        <p class="text-muted-foreground">
          The user with ID <span class="font-mono" th:text="${data.userId}">123</span> could not be
          found.
        </p>
        <div class="mt-4">
          <a class="btn btn-primary" href="/backoffice/users">
            <i class="icon icon-arrow-left w-4 h-4"></i>
            Back to Users
          </a>
        </div>
      </section>
    </div>

    <!-- User Detail Content -->
    <div th:if="${data.userEntry != null}"
         th:replace="~{backoffice/components/user/user-detail-view.html :: user-detail}"></div>
  </div>
</section>
</body>
</html>
