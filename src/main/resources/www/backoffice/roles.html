<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{backoffice/base.html :: fullLayout(~{::pageContent})}">

    <th:block th:fragment="pageContent">
        <!-- Breadcrumb Section -->
        <section class="bg-white border-b border-gray-200 px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <nav class="flex" aria-label="Breadcrumb">
                        <ol class="flex items-center space-x-2">
                            <li><span class="text-sm font-medium text-gray-900" th:text="${currentUser}">User Name</span></li>
                            <li><span class="text-gray-400">/</span></li>
                            <li><span class="text-sm text-gray-500">Roles</span></li>
                        </ol>
                    </nav>
                </div>
                <button hx-get="/htmx/backoffice/roles/create-modal" hx-target="#create-role-modal" hx-swap="innerHTML" hx-on::afterSwap="openModal('create-role-modal')"
                        class="inline-flex items-center px-4 py-2 bg-primary-600 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    <i data-feather="plus" class="w-4 h-4 mr-2"></i>
                    Create Role
                </button>
            </div>
        </section>

        <!-- Hero Section -->
        <section class="bg-gradient-to-r from-primary-600 to-primary-700 text-white">
            <div class="px-6 py-8">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-3xl font-bold">Roles Management</h1>
                        <p class="mt-2 text-primary-100">Manage user roles and permissions</p>
                    </div>
                    <div class="hidden lg:block">
                        <i data-feather="shield" class="h-16 w-16 text-primary-200"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Content Section -->
        <section class="px-6 py-6 space-y-6">
            <!-- Roles Table -->
            <div class="bg-white rounded-lg shadow border border-gray-200">
                <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                    <h2 class="text-lg font-medium text-gray-900 flex items-center"><i data-feather="shield" class="h-5 w-5 text-gray-400 mr-2"></i>System Roles</h2>
                    <button hx-get="/htmx/backoffice/roles" hx-target="#roles-table" hx-swap="innerHTML" class="text-gray-400 hover:text-gray-600">
                        <i data-feather="refresh-cw" class="h-5 w-5"></i>
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="roles-table" hx-get="/htmx/backoffice/roles" hx-trigger="load">
                            <tr><td colspan="3" class="text-center py-8"><img src="https://htmx.org/img/bars.svg" class="h-8 w-8 inline-block" alt="Loading..."></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- User Role Assignments -->
            <div class="bg-white rounded-lg shadow border border-gray-200">
                <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                    <h2 class="text-lg font-medium text-gray-900 flex items-center"><i data-feather="users" class="h-5 w-5 text-gray-400 mr-2"></i>User Role Assignments</h2>
                    <div class="flex items-center space-x-2">
                        <button hx-get="/htmx/backoffice/user-roles" hx-target="#user-roles-table" hx-swap="innerHTML" class="text-gray-400 hover:text-gray-600">
                            <i data-feather="refresh-cw" class="h-5 w-5"></i>
                        </button>
                        <button class="inline-flex items-center px-3 py-2 bg-primary-600 border border-transparent rounded-md shadow-sm text-sm font-medium text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500" onclick="openModal('assign-role-modal')">
                            <i data-feather="user-plus" class="h-4 w-4 mr-1"></i>
                            Assign Role
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="user-roles-table" hx-get="/htmx/backoffice/user-roles" hx-trigger="load">
                            <tr><td colspan="3" class="text-center py-8"><img src="https://htmx.org/img/bars.svg" class="h-8 w-8 inline-block" alt="Loading..."></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Assign Role Modal -->
            <div id="assign-role-modal" class="fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 hidden">
                <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
                    <div class="flex items-center justify-between p-6 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900">Assign Role to User</h3>
                        <button type="button" class="text-gray-400 hover:text-gray-500" onclick="closeModal('assign-role-modal')">
                            <span class="sr-only">Close</span>
                            <i data-feather="x" class="h-5 w-5"></i>
                        </button>
                    </div>
                    <form id="assign-role-form" class="p-6 space-y-4">
                        <div class="grid grid-cols-1 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Select User</label>
                                <select id="modalUserId" name="userId" hx-get="/htmx/backoffice/users-list" hx-trigger="load" hx-target="this" hx-swap="innerHTML" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary-500 focus:border-primary-500"><option>Loading users...</option></select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Select Role</label>
                                <select id="modalRoleId" name="roleId" hx-get="/htmx/backoffice/roles-list" hx-trigger="load" hx-target="this" hx-swap="innerHTML" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-primary-500 focus:border-primary-500"><option>Loading roles...</option></select>
                            </div>
                        </div>
                        <div id="assign-result" class="mt-2"></div>
                        <div class="flex justify-end pt-4 border-t border-gray-200">
                            <button type="button" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 mr-3" onclick="closeModal('assign-role-modal')">Cancel</button>
                            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-md hover:bg-primary-700">
                                <span id="assign-spinner" class="htmx-indicator"><i data-feather="loader" class="h-4 w-4 mr-2 animate-spin"></i></span>
                                Assign
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Placeholder for Create Role Modal -->
        <div id="create-role-modal"></div>

        <!-- Page-specific JS -->
        <script th:inline="javascript">
            /* modal helpers */
            function openModal(id){ const m=document.getElementById(id); if(m) { m.classList.remove('hidden'); feather.replace(); } }
            function closeModal(id){ const m=document.getElementById(id); if(m) m.classList.add('hidden'); }

            /* feather refresh after HTMX swaps */
            document.addEventListener('htmx:afterSwap', ()=>feather.replace());

            /* intercept assign-role form to send JSON */
            document.addEventListener('DOMContentLoaded', ()=>{
                const assignForm=document.getElementById('assign-role-form');
                if(assignForm){
                    assignForm.addEventListener('submit', async (e)=>{
                        e.preventDefault();
                        const userId=document.getElementById('modalUserId').value;
                        const roleId=document.getElementById('modalRoleId').value;
                        const spinner=document.getElementById('assign-spinner');
                        const resultBox=document.getElementById('assign-result');
                        spinner.classList.remove('hidden');
                        try{
                            const resp=await fetch('/backoffice/assign-role',{
                                method:'POST',
                                headers:{'Content-Type':'application/json'},
                                body:JSON.stringify({userId, roleId})
                            });
                            const data=await resp.json();
                            if(data.success){
                                resultBox.innerHTML='<p class="text-green-600">Role assigned successfully</p>';
                                htmx.ajax('GET','/htmx/backoffice/user-roles','#user-roles-table');
                            } else {
                                resultBox.innerHTML='<p class="text-red-600">'+(data.info||'Failed')+'</p>';
                            }
                        }catch(err){
                            resultBox.innerHTML='<p class="text-red-600">Error processing request</p>';
                        }finally{
                            spinner.classList.add('hidden');
                            feather.replace();
                        }
                    });
                }
            });
        </script>
    </th:block>
</html>
