<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{backoffice/base.html :: fullLayout(~{::pageContent})}">

    <th:block th:fragment="pageContent">
        <!-- Breadcrumb -->
        <section class="bg-white border-b border-gray-200 px-6 py-4">
            <div class="flex items-center space-x-2">
                <nav class="flex" aria-label="Breadcrumb">
                    <ol class="flex items-center space-x-2">
                        <li><a href="/backoffice/logs" class="text-sm font-medium text-primary-600 hover:underline">Logs</a></li>
                        <li><span class="text-gray-400">/</span></li>
                        <li><span class="text-sm text-gray-500">Log #<span th:text="${logId}">123</span></span></li>
                    </ol>
                </nav>
            </div>
        </section>

        <!-- Hero -->
        <section class="bg-gradient-to-r from-primary-600 to-primary-700 text-white">
            <div class="px-6 py-8 flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold">Log Entry Details</h1>
                    <p class="mt-2 text-primary-100">View full information for this log entry</p>
                </div>
                <div class="hidden lg:block"><i data-feather="file-text" class="h-16 w-16 text-primary-200"></i></div>
            </div>
        </section>

        <!-- Details Card -->
        <section class="px-6 py-6">
            <div class="bg-white shadow rounded-lg p-6 space-y-4">
                <div class="flex items-center space-x-2">
                    <span class="text-sm font-semibold text-gray-700">Level:</span>
                    <span class="px-2 py-1 rounded text-white text-xs" th:text="${logLevel}"
                          th:classappend="${logLevel}=='ERROR'?'bg-red-600':(${logLevel}=='WARN'?'bg-yellow-500':(${logLevel}=='INFO'?'bg-blue-600':'bg-gray-600'))">INFO</span>
                </div>

                <div><span class="font-semibold">Timestamp:</span> <span th:text="${logTimestamp}">2024-01-01 12:00:00</span></div>
                <div><span class="font-semibold">Logger:</span> <span th:text="${logLogger}">org.example.MyClass</span></div>
                <div><span class="font-semibold">Method:</span> <span th:text="${logMethod}">myMethod</span> <span th:text="'(' + ${logLine} + ')'">(42)</span></div>
                <div><span class="font-semibold">Thread:</span> <span th:text="${logThread}">main</span></div>
                <div>
                    <span class="font-semibold">Message:</span>
                    <pre class="whitespace-pre-wrap bg-gray-50 p-3 rounded border border-gray-200" th:text="${logMessage}">Sample log message</pre>
                </div>
                <div th:if="${logException} != ''">
                    <span class="font-semibold">Exception:</span>
                    <pre class="whitespace-pre-wrap bg-red-50 text-red-700 p-3 rounded border border-red-200" th:text="${logException}">Stack trace...</pre>
                </div>

                <div class="pt-4">
                    <a href="/backoffice/logs" class="inline-flex items-center px-4 py-2 bg-primary-600 text-white text-sm rounded hover:bg-primary-700">
                        <i data-feather="arrow-left" class="h-4 w-4 mr-2"></i>Back to Logs
                    </a>
                </div>
            </div>
        </section>

        <script th:inline="javascript">document.addEventListener('htmx:afterSwap',()=>feather.replace());</script>
    </th:block>
</html>
