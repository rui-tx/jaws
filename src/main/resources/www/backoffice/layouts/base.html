<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title layout:title-pattern="$CONTENT_TITLE - Jaws Backoffice">Jaws Backoffice</title>
    <link th:href="@{/backoffice/styles.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.2/dist/js/basecoat.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.2.8/dist/js/sidebar.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/basecoat-css@0.3.2/dist/js/toast.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.2" crossorigin="anonymous" defer></script>
    <script th:src="@{/backoffice/scripts/base.js}" defer></script>
    <script th:src="@{/backoffice/scripts/auth.js}" defer></script>
    <script th:src="@{/backoffice/scripts/refresh-button.js}" defer></script>
</head>
<body class="min-h-screen bg-background" hx-ext="sse">

    <!-- SSE notifications will append to #toaster as toasts -->
    <div
        hx-ext="sse"
        sse-connect="/events"
        sse-swap="notification"
        hx-target="#toaster"
        hx-swap="beforeend">
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" data-side="left" aria-hidden="false">
        <nav aria-label="Sidebar navigation">
            <header class="p-4 border-b">
                <h1 class="text-xl font-bold">JAWS</h1>
            </header>
            
            <section class="scrollbar">
                <div role="group" aria-labelledby="group-label-main">
                    <h3 id="group-label-main" class="sr-only">Main Navigation</h3>
                    
                    <ul>
                        <li>
                            <a href="/backoffice" class="flex items-center gap-3 px-4 py-3 hover:bg-accent">
                                <i class="icon icon-home w-5 h-5"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="/backoffice/logs" class="flex items-center gap-3 px-4 py-3 hover:bg-accent">
                                <i class="icon icon-document-text w-5 h-5"></i>
                                <span>Logs</span>
                            </a>
                        </li>
                        <li>
                            <a href="/backoffice/users" class="flex items-center gap-3 px-4 py-3 hover:bg-accent">
                                <i class="icon icon-users w-5 h-5"></i>
                                <span>Users</span>
                            </a>
                        </li>
                </div>
            </section>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1">
        <!-- Top Bar -->
        <header class="flex items-center justify-between p-4 border-b bg-background">
            <div class="flex items-center gap-4">
                <button type="button"
                        onclick="document.dispatchEvent(new CustomEvent('basecoat:sidebar'))"
                        class="btn btn-ghost btn-sm min-h-[44px] min-w-[44px]">
                    <i class="icon icon-bars-3 w-5 h-5"></i>
                </button>
                <h2 class="text-lg font-semibold"
                    th:text="${data != null and data.currentPage != null
                     ? (data.currentPage == 'dashboard' ? 'Dashboard'
                         : data.currentPage == 'logs' ? 'System Logs'
                         : data.currentPage == 'log-detail' ? 'Log Detail'
                         : data.currentPage == 'users' ? 'Users'
                         : data.currentPage == 'user-detail' ? 'User Detail'
                       : 'Dashboard')
                     : 'Dashboard'}">Dashboard</h2>
            </div>
            
            <div class="flex items-center gap-2">
                <button
                    class="btn btn-ghost btn-sm min-h-[44px] min-w-[44px]"
                    hx-get="/backoffice/htmx/toast/test/this-is-toast-example"
                    hx-swap="beforeend"
                    hx-target="#toaster"
                    hx-trigger="click"
                >
                  <i class="icon icon-trash w-5 h-5"></i>
                </button>

                <button class="btn btn-ghost btn-sm min-h-[44px] min-w-[44px]">
                    <i class="icon icon-bell w-5 h-5"></i>
                </button>

                <button class="btn btn-ghost btn-sm min-h-[44px] min-w-[44px]" onclick="document.dispatchEvent(new CustomEvent('basecoat:theme'))" id="theme-toggle">
                    <div id="sun-icon">
                        <i class="icon icon-sun w-5 h-5"></i>
                    </div>
                    <div id="moon-icon" class="hidden">
                        <i class="icon icon-moon w-5 h-5"></i>
                    </div>
                </button>

            </div>
        </header>

        <!-- Page Content -->
        <div class="p-4 md:p-6">
            <section layout:fragment="content">
                <p>Page content goes here</p>
            </section>
        </div>
    </main>
    <div id="toaster" class="toaster"></div>
</body>
</html>
