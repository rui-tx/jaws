<!DOCTYPE html>
<html layout:decorate="~{backoffice/layouts/base.html}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>System Logs</title>
  <script defer
          src="https://cdn.jsdelivr.net/npm/basecoat-css@0.2.8/dist/js/select.min.js"></script>
  <script>
    // Debounce function to limit API calls
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Function to apply filters
    function applyFilters() {
      console.log('applyFilters called');
      const form = document.getElementById('filters-form');
      if (form) {
        // Get current values from comboboxes
        const levelSelect = document.getElementById('level-select');
        const sourceSelect = document.getElementById('source-select');
        const sizeSelect = document.getElementById('size-select');
        const searchInput = document.getElementById('search-filter');

        // Update form hidden inputs
        if (levelSelect) {
          const levelInput = levelSelect.querySelector('input[type="hidden"]');
          const formLevelInput = form.querySelector('input[name="level"]');
          if (levelInput && formLevelInput) {
            formLevelInput.value = levelInput.value;
            console.log('Level value:', levelInput.value);
          }
        }

        if (sourceSelect) {
          const sourceInput = sourceSelect.querySelector('input[type="hidden"]');
          const formSourceInput = form.querySelector('input[name="source"]');
          if (sourceInput && formSourceInput) {
            formSourceInput.value = sourceInput.value;
            console.log('Source value:', sourceInput.value);
          }
        }

        if (sizeSelect) {
          const sizeInput = sizeSelect.querySelector('input[type="hidden"]');
          const formSizeInput = form.querySelector('input[name="size"]');
          if (sizeInput && formSizeInput) {
            formSizeInput.value = sizeInput.value;
            console.log('Size value:', sizeInput.value);
          }
        }

        // Build query string
        const params = new URLSearchParams();
        if (form.querySelector('input[name="level"]').value) {
          params.append('level', form.querySelector('input[name="level"]').value);
        }
        if (form.querySelector('input[name="source"]').value) {
          params.append('source', form.querySelector('input[name="source"]').value);
        }
        if (form.querySelector('input[name="search"]').value) {
          params.append('search', form.querySelector('input[name="search"]').value);
        }
        if (form.querySelector('input[name="size"]').value) {
          params.append('size', form.querySelector('input[name="size"]').value);
        }
        params.append('page', '0'); // Reset to first page when filtering

        console.log('Query params:', params.toString());

        // Trigger HTMX request
        htmx.ajax('GET', '/backoffice/htmx/logs-filtered?' + params.toString(), {
          target: '#logs-table-container',
          swap: 'outerHTML',
          indicator: '#loading-indicator'
        });
      }
    }

    // Debounced version of applyFilters for search input
    const debouncedApplyFilters = debounce(applyFilters, 500);

    // Initialize filters when the page loads
    document.addEventListener('DOMContentLoaded', function () {
      console.log('DOM loaded, initializing filters');

      // Wait for Basecoat select.js to initialize
      setTimeout(function () {
        console.log('Setting up combobox event listeners');

        // Add event listeners for combobox changes
        const levelSelect = document.getElementById('level-select');
        const sourceSelect = document.getElementById('source-select');
        const sizeSelect = document.getElementById('size-select');

        if (levelSelect) {
          console.log('Setting up level select');
          // Listen for changes on the hidden input
          const levelInput = levelSelect.querySelector('input[type="hidden"]');
          if (levelInput) {
            levelInput.addEventListener('change', function () {
              console.log('Level changed:', this.value);
              // Don't auto-apply, let user click button
            });
          }
        }

        if (sourceSelect) {
          console.log('Setting up source select');
          // Listen for changes on the hidden input
          const sourceInput = sourceSelect.querySelector('input[type="hidden"]');
          if (sourceInput) {
            sourceInput.addEventListener('change', function () {
              console.log('Source changed:', this.value);
              // Don't auto-apply, let user click button
            });
          }
        }

        if (sizeSelect) {
          console.log('Setting up size select');
          // Listen for changes on the hidden input
          const sizeInput = sizeSelect.querySelector('input[type="hidden"]');
          if (sizeInput) {
            sizeInput.addEventListener('change', function () {
              console.log('Size changed:', this.value);
              // Don't auto-apply, let user click button
            });
          }
        }
      }, 200); // Increased delay to ensure Basecoat is loaded

      // Handle search input with debouncing
      const searchInput = document.getElementById('search-filter');
      if (searchInput) {
        searchInput.addEventListener('input', debouncedApplyFilters);
        searchInput.addEventListener('keypress', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            applyFilters(); // Apply immediately on Enter
          }
        });
      }
    });

    // Function to clear filters
    function clearFilters() {
      console.log('clearFilters called');
      const form = document.getElementById('filters-form');
      if (form) {
        // Reset combobox elements to their default options
        const levelSelect = document.getElementById('level-select');
        const sourceSelect = document.getElementById('source-select');
        const sizeSelect = document.getElementById('size-select');
        const searchInput = document.getElementById('search-filter');

        if (levelSelect) {
          // Reset combobox to default
          const levelInput = levelSelect.querySelector('input[type="hidden"]');
          const levelTrigger = levelSelect.querySelector('button');
          if (levelInput) {
            levelInput.value = '';
          }
          if (levelTrigger) {
            levelTrigger.querySelector('span').textContent = 'All Levels';
          }
        }

        if (sourceSelect) {
          // Reset combobox to default
          const sourceInput = sourceSelect.querySelector('input[type="hidden"]');
          const sourceTrigger = sourceSelect.querySelector('button');
          if (sourceInput) {
            sourceInput.value = '';
          }
          if (sourceTrigger) {
            sourceTrigger.querySelector('span').textContent = 'All Sources';
          }
        }

        if (sizeSelect) {
          // Reset combobox to default
          const sizeInput = sizeSelect.querySelector('input[type="hidden"]');
          const sizeTrigger = sizeSelect.querySelector('button');
          if (sizeInput) {
            sizeInput.value = '25';
          }
          if (sizeTrigger) {
            sizeTrigger.querySelector('span').textContent = '25 per page';
          }
        }

        if (searchInput) {
          searchInput.value = ''; // Clear search input
        }

        // Trigger HTMX request to clear filters
        applyFilters();
      }
    }

    // Handle view button clicks
    function handleViewButtonClick(event) {
      const button = event.target.closest('button');
      if (button && button.getAttribute('data-action') === 'view') {
        const rowId = button.getAttribute('data-row-id');
        if (rowId) {
          // Check if we're on the users page or logs page
          const isUsersPage = window.location.pathname.includes('/users');
          const baseUrl = isUsersPage ? '/backoffice/users/' : '/backoffice/logs/';
          window.location.href = baseUrl + rowId;
        }
      }
    }

    // Add event listener for view button clicks
    document.addEventListener('click', handleViewButtonClick);
  </script>
</head>
<body>
<section layout:fragment="content">
  <div class="space-y-6">
    <!-- Page Header -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">System Logs</h1>
        <p class="text-muted-foreground">View and filter system log entries</p>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost btn-sm"
                hx-get="/backoffice/htmx/logs-filtered?page=0&size=25"
                hx-swap="outerHTML"
                hx-target="#logs-table-container"
                title="Refresh Logs">
          <i class="icon icon-arrow-path w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="card">
      <header>
        <h2 class="text-lg font-semibold">Filters</h2>
      </header>
      <section>
        <form class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"
              id="filters-form">

          <!-- Log Level Filter -->
          <div>
            <label class="form-label" for="level-select"></label>
            <div class="select" id="level-select">
              <button aria-controls="level-select-listbox" aria-expanded="false"
                      aria-haspopup="listbox"
                      class="btn-outline justify-between font-normal w-full"
                      id="level-select-trigger"
                      type="button">
                <span class="truncate">All Levels</span>
                <svg
                    class="lucide lucide-chevrons-up-down-icon lucide-chevrons-up-down text-muted-foreground opacity-50 shrink-0"
                    fill="none" height="24" stroke="currentColor"
                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    viewBox="0 0 24 24"
                    width="24"
                    xmlns="http://www.w3.org/2000/svg">
                  <path d="m7 15 5 5 5-5"/>
                  <path d="m7 9 5-5 5 5"/>
                </svg>
              </button>
              <div aria-hidden="true" data-popover id="level-select-popover">
                <header>
                  <svg class="lucide lucide-search-icon lucide-search" fill="none" height="24"
                       stroke="currentColor"
                       stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                       viewBox="0 0 24 24"
                       width="24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.3-4.3"/>
                  </svg>
                  <input aria-autocomplete="list" aria-controls="level-select-listbox"
                         aria-expanded="false" aria-labelledby="level-select-trigger"
                         autocomplete="off" autocorrect="off" placeholder="Search level..."
                         role="combobox"
                         spellcheck="false" type="text"
                         value=""/>
                </header>
                <div aria-labelledby="level-select-trigger" aria-orientation="vertical"
                     data-empty="No level found."
                     id="level-select-listbox" role="listbox">
                  <div data-value="" role="option">All Levels</div>
                  <div role="option" th:data-value="${level}"
                       th:each="level : ${data.logLevels}"
                       th:text="${level}">INFO
                  </div>
                </div>
              </div>
              <input name="level" type="hidden" value=""/>
            </div>
          </div>

          <!-- Source Filter -->
          <div>
            <label class="form-label" for="source-select"></label>
            <div class="select" id="source-select">
              <button aria-controls="source-select-listbox" aria-expanded="false"
                      aria-haspopup="listbox"
                      class="btn-outline justify-between font-normal w-full"
                      id="source-select-trigger"
                      type="button">
                <span class="truncate"></span>
                <svg
                    class="lucide lucide-chevrons-up-down-icon lucide-chevrons-up-down text-muted-foreground opacity-50 shrink-0"
                    fill="none" height="24" stroke="currentColor"
                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    viewBox="0 0 24 24"
                    width="24"
                    xmlns="http://www.w3.org/2000/svg">
                  <path d="m7 15 5 5 5-5"/>
                  <path d="m7 9 5-5 5 5"/>
                </svg>
              </button>
              <div aria-hidden="true" data-popover id="source-select-popover">
                <header>
                  <svg class="lucide lucide-search-icon lucide-search" fill="none" height="24"
                       stroke="currentColor"
                       stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                       viewBox="0 0 24 24"
                       width="24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.3-4.3"/>
                  </svg>
                  <input aria-autocomplete="list" aria-controls="source-select-listbox"
                         aria-expanded="false" aria-labelledby="source-select-trigger"
                         autocomplete="off" autocorrect="off" placeholder="Search source..."
                         role="combobox"
                         spellcheck="false" type="text"
                         value=""/>
                </header>
                <div aria-labelledby="source-select-trigger" aria-orientation="vertical"
                     data-empty="No source found."
                     id="source-select-listbox" role="listbox">
                  <div data-value="" role="option">All Sources</div>
                  <div role="option" th:data-value="${source}"
                       th:each="source : ${data.logSources}"
                       th:text="${source}">System
                  </div>
                </div>
              </div>
              <input name="source" type="hidden" value=""/>
            </div>
          </div>

          <!-- Search Filter -->
          <div>
            <label class="form-label" for="search-filter"></label>
            <input class="input"
                   id="search-filter"
                   name="search"
                   placeholder="Search in messages..."
                   type="text">
          </div>

          <!-- Page Size -->
          <div>
            <label class="form-label" for="size-select"></label>
            <div class="select" id="size-select">
              <button aria-controls="size-select-listbox" aria-expanded="false"
                      aria-haspopup="listbox"
                      class="btn-outline justify-between font-normal w-full"
                      id="size-select-trigger"
                      type="button">
                <span class="truncate">25 per page</span>
                <svg
                    class="lucide lucide-chevrons-up-down-icon lucide-chevrons-up-down text-muted-foreground opacity-50 shrink-0"
                    fill="none" height="24" stroke="currentColor"
                    stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    viewBox="0 0 24 24"
                    width="24"
                    xmlns="http://www.w3.org/2000/svg">
                  <path d="m7 15 5 5 5-5"/>
                  <path d="m7 9 5-5 5 5"/>
                </svg>
              </button>
              <div aria-hidden="true" data-popover id="size-select-popover">
                <div aria-labelledby="size-select-trigger" aria-orientation="vertical"
                     id="size-select-listbox" role="listbox">
                  <div data-value="25" role="option">25 per page</div>
                  <div data-value="50" role="option">50 per page</div>
                  <div data-value="100" role="option">100 per page</div>
                </div>
              </div>
              <input name="size" type="hidden" value="25"/>
            </div>
          </div>
        </form>

        <!-- Clear Filters Button -->
        <div class="flex justify-between items-center mt-4">
          <button class="btn"
                  onclick="clearFilters()"
                  type="button">
            <i class="icon icon-x-mark w-4 h-4"></i>
            Clear Filters
          </button>
          <div class="flex items-center gap-2">
            <button class="btn btn-primary btn-sm"
                    onclick="applyFilters()"
                    type="button">
              <i class="icon icon-funnel w-4 h-4"></i>
              Apply Filters
            </button>
            <div class="text-sm text-muted-foreground">
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Loading Indicator -->
    <div class="htmx-indicator flex justify-center p-4" id="loading-indicator"
         style="display: none;">
      <div class="flex items-center gap-2">
        <i class="icon icon-arrow-path w-4 h-4 animate-spin"></i>
        <span>Loading logs...</span>
      </div>
    </div>

    <!-- Logs Table Container -->
    <div id="logs-table-container">
      <div hx-get="/backoffice/htmx/logs-filtered?page=0&size=25"
           hx-swap="outerHTML transition:true"
           hx-trigger="load"
           id="logs-table">
        <!-- Skeleton state while loading -->
        <div th:replace="~{backoffice/components/table/table.html :: table-skeleton}"></div>
      </div>
    </div>
  </div>
</section>

<script>
  // Initialize filters when the page loads
  document.addEventListener('DOMContentLoaded', function () {
    // Wait for Basecoat select.js to initialize
    setTimeout(function () {
      // Add event listeners for combobox changes
      const levelSelect = document.getElementById('level-select');
      const sourceSelect = document.getElementById('source-select');

      if (levelSelect) {
        // Listen for changes on the hidden input
        const levelInput = levelSelect.querySelector('input[type="hidden"]');
        if (levelInput) {
          levelInput.addEventListener('change', function () {
            // Update the form's hidden input
            const formLevelInput = document.querySelector('input[name="level"]');
            if (formLevelInput) {
              formLevelInput.value = this.value;
            }
            // Trigger HTMX request
            const form = document.getElementById('filters-form');
            if (form) {
              htmx.trigger(form, 'submit');
            }
          });
        }
      }

      if (sourceSelect) {
        // Listen for changes on the hidden input
        const sourceInput = sourceSelect.querySelector('input[type="hidden"]');
        if (sourceInput) {
          sourceInput.addEventListener('change', function () {
            // Update the form's hidden input
            const formSourceInput = document.querySelector('input[name="source"]');
            if (formSourceInput) {
              formSourceInput.value = this.value;
            }
            // Trigger HTMX request
            const form = document.getElementById('filters-form');
            if (form) {
              htmx.trigger(form, 'submit');
            }
          });
        }
      }
    }, 100);

    // Allow Enter key in search input to trigger filtering
    const searchInput = document.getElementById('search-filter');
    if (searchInput) {
      searchInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          // The form will automatically trigger due to hx-trigger="change"
        }
      });
    }
  });
</script>
</body>
</html>
