<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{backoffice/base.html :: fullLayout(~{::pageContent})}">

    <th:block th:fragment="pageContent">
        <!-- Actions fragment for breadcrumb -->
        <th:block th:fragment="saveArea">
            <button id="save-profile" type="button" class="inline-flex items-center px-4 py-2 bg-primary-600 text-white text-sm rounded hover:bg-primary-700">
                <i data-feather="save" class="h-4 w-4 mr-2"></i>
                Save Changes
            </button>
        </th:block>

        <th:block th:replace="~{components/breadcrumb/breadcrumb.html :: breadcrumb(parentText='Dashboard', parentUrl='/backoffice', currentText='Profile', actions=~{::saveArea})}" />

        <th:block th:replace="~{components/hero/hero.html :: hero(title=${'Profile from ' + userFirstName + ' ' + userLastName}, subtitle='Manage user profile information', icon='user')}" />

        <!-- Profile Overview Card -->
        <section class="px-6 py-6">
            <div class="bg-white rounded-lg shadow border border-gray-200 p-6 flex items-center space-x-6">
                <img th:src="${userProfilePicture != null && !userProfilePicture.isEmpty() ? userProfilePicture : 'https://openmoji.org/data/color/svg/1F9D9-200D-2642-FE0F.svg'}" alt="avatar" class="h-24 w-24 rounded-full border-4 border-white shadow" />
                <div>
                    <h2 class="text-2xl font-bold text-gray-900" th:text="${username}">Username</h2>
                    <p class="text-sm text-gray-600" th:text="${userEmail}">email@example.com</p>
                    <p class="text-sm text-gray-500 mt-1">Member since <span th:text="${createdAt}">2024-01-01</span></p>
                </div>
            </div>
        </section>

        <!-- Profile Form & Panels -->
        <section class="px-6 pb-10">
            <form id="profile-form" class="space-y-6">

                <!-- Basic Information Panel -->
                <div class="bg-white rounded-lg shadow border border-gray-200">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900 flex items-center space-x-2">
                            <i data-feather="user" class="h-5 w-5 text-gray-400"></i>
                            <span>Basic Information</span>
                        </h3>
                    </div>
                    <div class="p-6 grid grid-cols-1 gap-6 md:grid-cols-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Username</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm bg-gray-50" name="username" type="text" th:value="${username}" disabled readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Email</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="email" type="email" th:value="${userEmail}">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">First Name</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="firstName" type="text" th:value="${userFirstName}">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Last Name</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="lastName" type="text" th:value="${userLastName}">
                        </div>
                    </div>
                </div>

                <!-- Security Panel -->
                <div class="bg-white rounded-lg shadow border border-gray-200">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900 flex items-center space-x-2">
                            <i data-feather="lock" class="h-5 w-5 text-gray-400"></i>
                            <span>Security</span>
                        </h3>
                    </div>
                    <div class="p-6 grid grid-cols-1 gap-6 md:grid-cols-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">New Password</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="password" type="password">
                            <p class="mt-2 text-xs text-gray-500">Leave blank to keep the current password.</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Last Login</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm bg-gray-50" name="lastLogin" type="text" th:value="${lastLogin}" disabled readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Failed Login Attempts</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm bg-gray-50" name="failedLoginAttempts" type="number" th:value="${failedLoginAttempts}" disabled readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Lockout Until</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm bg-gray-50" name="lockoutUntil" type="text" th:value="${lockoutUntil}" disabled readonly>
                        </div>
                    </div>
                </div>

                <!-- Personal Details Panel -->
                <div class="bg-white rounded-lg shadow border border-gray-200">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900 flex items-center space-x-2">
                            <i data-feather="calendar" class="h-5 w-5 text-gray-400"></i>
                            <span>Personal Details</span>
                        </h3>
                    </div>
                    <div class="p-6 space-y-6">
                        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Birthdate</label>
                                <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="birthdate" type="date" th:value="${birthdate}">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Gender</label>
                                <select class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="gender">
                                    <option value="">Select gender</option>
                                    <option value="male" th:selected="${gender == 'male'}">Male</option>
                                    <option value="female" th:selected="${gender == 'female'}">Female</option>
                                    <option value="other" th:selected="${gender == 'other'}">Other</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                                <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="phoneNumber" type="tel" th:value="${phoneNumber}">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Location</label>
                                <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="location" type="text" th:value="${location}">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700">Website</label>
                                <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="website" type="url" th:value="${website}">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700">Bio</label>
                                <textarea class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="bio" rows="3" th:text="${bio}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Picture & Metadata Panel -->
                <div class="bg-white rounded-lg shadow border border-gray-200">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900 flex items-center space-x-2">
                            <i data-feather="image" class="h-5 w-5 text-gray-400"></i>
                            <span>Profile Picture & Metadata</span>
                        </h3>
                    </div>
                    <div class="p-6 grid grid-cols-1 gap-6 md:grid-cols-2">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Profile Picture URL</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" name="profilePicture" type="url" th:value="${userProfilePicture}">
                        </div>
                        <div class="flex items-center justify-center">
                            <img id="profile-preview" class="h-20 w-20 rounded-full border border-gray-300" th:src="${userProfilePicture != null && !userProfilePicture.isEmpty() ? userProfilePicture : 'https://openmoji.org/data/color/svg/1F9D9-200D-2642-FE0F.svg'}" alt="Preview" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Created At</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm bg-gray-50" type="text" th:value="${createdAt}" disabled readonly>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Updated At</label>
                            <input class="mt-1 block w-full border-gray-300 rounded-md shadow-sm bg-gray-50" type="text" th:value="${updatedAt}" disabled readonly>
                        </div>
                    </div>
                </div>
            </form>
        </section>

        <!-- JS -->
        <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', ()=>{
            feather.replace();

            const saveBtn=document.getElementById('save-profile');
            const form=document.getElementById('profile-form');
            const msg=document.getElementById('profile-message');
            const preview=document.getElementById('profile-preview');
            const picInput=form.querySelector('input[name="profilePicture"]');

            if(picInput){picInput.addEventListener('input',()=>{preview.src=picInput.value||'https://openmoji.org/data/color/svg/1F9D9-200D-2642-FE0F.svg';});}

            saveBtn.addEventListener('click',()=>{
              const data=Object.fromEntries(new FormData(form));
              if(!data.password||data.password.trim()===''){delete data.password;}
              Object.keys(data).forEach(k=>{if(data[k]===''||data[k]===null){data[k]=null;}});

              fetch(window.location.pathname,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':localStorage.getItem('auth_token')?`Bearer ${localStorage.getItem('auth_token')}`:''},body:JSON.stringify(data)})
              .then(r=>r.text().then(t=>({ok:r.ok,text:t})))
              .then(res=>{
                 msg.innerHTML=`<div class="${res.ok?'bg-green-50 border-green-200 text-green-800':'bg-red-50 border-red-200 text-red-800'} border rounded-md p-4 text-sm">${res.text|| (res.ok?'Profile updated successfully':'Error updating profile')}</div>`;
                 msg.classList.remove('hidden');
                 setTimeout(()=>msg.classList.add('hidden'),3000);
              })
              .catch(()=>{
                 msg.innerHTML='<div class="bg-red-50 border border-red-200 rounded-md p-4 text-sm text-red-800">Network error. Please try again.</div>';
                 msg.classList.remove('hidden');
              });
            });
        });
        </script>
        
        <script th:inline="javascript">document.addEventListener('htmx:afterSwap',()=>feather.replace());</script>
    </th:block>
</html>
