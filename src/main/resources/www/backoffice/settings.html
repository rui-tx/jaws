<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{backoffice/base.html :: fullLayout(~{::pageContent})}">

    <th:block th:fragment="pageContent">
        <!-- Breadcrumb -->
        <section class="bg-white border-b border-gray-200 px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <nav class="flex" aria-label="Breadcrumb">
                        <ol class="flex items-center space-x-2">
                            <li><span class="text-sm font-medium text-gray-900" th:text="${currentUser}">User Name</span></li>
                            <li><span class="text-gray-400">/</span></li>
                            <li><span class="text-sm text-gray-500">Settings</span></li>
                        </ol>
                    </nav>
                </div>
            </div>
        </section>

        <!-- Hero -->
        <section class="bg-gradient-to-r from-primary-600 to-primary-700 text-white">
            <div class="px-6 py-8 flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold">Application Settings</h1>
                    <p class="mt-2 text-primary-100">Configure system parameters</p>
                </div>
                <div class="hidden lg:block"><i data-feather="settings" class="h-16 w-16 text-primary-200"></i></div>
            </div>
        </section>

        <!-- Main Content copied from original page -->
        <section class="px-6 py-6">
            <div class="p-6 space-y-6 bg-white shadow rounded-lg">
                <!-- Header -->
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-gray-900">Settings</h1>
                    <p class="text-sm text-gray-600">Manage application settings and configuration</p>
                </div>

                <!-- System Settings -->
                <div class="bg-white shadow rounded-lg mb-6 settings-card">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-medium text-gray-900 flex items-center"><i data-feather="server" class="w-5 h-5 mr-2"></i>System Configuration</h3>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Application Name</label>
                                <input type="text" value="Jaws Backoffice" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Version</label>
                                <input type="text" value="0.2-alpha" readonly class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Environment</label>
                                <select class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                                    <option value="development" selected>Development</option>
                                    <option value="staging">Staging</option>
                                    <option value="production">Production</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Log Level</label>
                                <select class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
                                    <option value="DEBUG">Debug</option>
                                    <option value="INFO" selected>Info</option>
                                    <option value="WARN">Warning</option>
                                    <option value="ERROR">Error</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Database Settings -->
                <div class="bg-white shadow rounded-lg mb-6 settings-card">
                    <div class="px-6 py-4 border-b border-gray-200"><h3 class="text-lg font-medium text-gray-900 flex items-center"><i data-feather="database" class="w-5 h-5 mr-2"></i>Database Configuration</h3></div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label class="block text-sm font-medium text-gray-700 mb-2">Database Type</label><input type="text" value="SQLite" readonly class="w-full border border-gray-300 rounded-md px-3 py-2 bg-gray-50 focus:outline-none"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-2">Database Path</label><input type="text" value="src/main/resources/db.db" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-2">Connection Pool Size</label><input type="number" value="10" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-2">Query Timeout (seconds)</label><input type="number" value="30" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500"></div>
                        </div>
                    </div>
                </div>

                <!-- Security Settings (trimmed for brevity) -->
                <div class="bg-white shadow rounded-lg mb-6 settings-card" th:utext="${securitySettingsCard}"></div>

                <!-- Job System Settings (trimmed) -->
                <div class="bg-white shadow rounded-lg mb-6 settings-card" th:utext="${jobSettingsCard}"></div>

                <!-- Cache Settings (trimmed) -->
                <div class="bg-white shadow rounded-lg mb-6 settings-card" th:utext="${cacheSettingsCard}"></div>

                <!-- Save Settings -->
                <div class="flex justify-end">
                    <button type="button" class="inline-flex items-center px-4 py-2 bg-primary-600 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition ease-in-out duration-150">
                        <i data-feather="save" class="w-4 h-4 mr-2"></i>Save Settings
                    </button>
                </div>
            </div>
        </section>

        <!-- Feather refresh after dynamic swaps -->
        <script th:inline="javascript">document.addEventListener('htmx:afterSwap',()=>feather.replace());</script>
    </th:block>
</html>
