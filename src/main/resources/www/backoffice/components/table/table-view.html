<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Generic Table Container -->
<div th:if="${data.headers != null and data.headers.contains('Timestamp')}" id="logs-table-container">
    <!-- Logs table with view action support -->
    <div th:replace="~{backoffice/components/table/table.html :: table-logs-with-pagination(
        ${data.headers},
        ${data.rows},
        ${data.caption},
        ${data.actions},
        ${data.pagination}
    )}"></div>
</div>

<div th:if="${data.headers != null and data.headers.contains('Username')}" id="users-table-container">
    <!-- Users table with view action support -->
    <div th:replace="~{backoffice/components/table/table.html :: table-users-with-pagination(
        ${data.headers},
        ${data.rows},
        ${data.caption},
        ${data.actions},
        ${data.pagination}
    )}"></div>
</div>
</body>
</html>
