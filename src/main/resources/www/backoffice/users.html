<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{backoffice/base.html :: fullLayout(~{::pageContent})}">

    <th:block th:fragment="pageContent">
        <!-- Actions fragment for breadcrumb -->
        <th:block th:replace="~{components/breadcrumb/breadcrumb.html :: breadcrumb(parentText='Dashboard', parentUrl='/backoffice', currentText='Users', actions=~{components/breadcrumb/breadcrumb-button.html :: breadcrumbButton(text='New user', icon='user-plus', href=null, onclick='openModal(\'create-user-modal\')')})}" />

        <th:block th:replace="~{components/hero/hero.html :: hero(title='Users Management', subtitle='Manage user accounts and permissions', icon='users')}" />

        <!-- Main Content Section -->
        <section class="px-6 py-6">
            <div class="bg-white rounded-lg shadow border border-gray-200">
                <div th:if="${canAccessRoles == 'true'}"
                     th:replace="~{components/data-table/data-table.html :: data-table(title='Users', icon='users', endpoint='/htmx/backoffice/users', refreshable=true)}"></div>
            </div>
        </section>

        <!-- Create User Modal -->
        <div class="fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 hidden" id="create-user-modal">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between p-6 border-b border-gray-200">
                    <h3 class="text-lg font-medium text-gray-900">Create New User</h3>
                    <button type="button" class="text-gray-400 hover:text-gray-500" onclick="closeModal('create-user-modal')">
                        <span class="sr-only">Close</span>
                        <i data-feather="x" class="h-5 w-5"></i>
                    </button>
                </div>
                
                <form id="create-user-form" class="p-6 space-y-4">
                    <!-- Username -->
                    <div>
                        <label for="new-username" class="block text-sm font-medium text-gray-700">Username</label>
                        <div class="mt-1 relative">
                            <input class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-primary-500 focus:border-primary-500 pl-10" id="new-username" name="username" placeholder="e.g. user" required>
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="user" class="h-5 w-5 text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                    <!-- First Name -->
                    <div>
                        <label for="new-first-name" class="block text-sm font-medium text-gray-700">First Name</label>
                        <div class="mt-1 relative">
                            <input class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-primary-500 focus:border-primary-500 pl-10" id="new-first-name" name="firstName" placeholder="e.g. Alex" required type="text">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="user" class="h-5 w-5 text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                    <!-- Last Name -->
                    <div>
                        <label for="new-last-name" class="block text-sm font-medium text-gray-700">Last Name</label>
                        <div class="mt-1 relative">
                            <input class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-primary-500 focus:border-primary-500 pl-10" id="new-last-name" name="lastName" placeholder="e.g. Smith" required type="text">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="user" class="h-5 w-5 text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                    <!-- Password -->
                    <div>
                        <label for="new-password" class="block text-sm font-medium text-gray-700">Password</label>
                        <div class="mt-1 relative">
                            <input class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-primary-500 focus:border-primary-500 pl-10" id="new-password" name="password" placeholder="••••••••" required type="password">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="lock" class="h-5 w-5 text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                    <!-- Confirm Password -->
                    <div>
                        <label for="new-password-confirmation" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                        <div class="mt-1 relative">
                            <input class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-primary-500 focus:border-primary-500 pl-10" id="new-password-confirmation" name="passwordConfirmation" placeholder="••••••••" required type="password">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="lock" class="h-5 w-5 text-gray-400"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Message display area -->
                    <div id="create-user-message" class="hidden"></div>

                    <!-- Spinner -->
                    <div class="flex justify-center py-4 hidden" id="create-user-spinner">
                        <img alt="Submitting..." class="h-6 w-6" src="https://htmx.org/img/bars.svg"/>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                        <button type="button" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50" onclick="closeModal('create-user-modal')">Cancel</button>
                        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-green-600 border border-transparent rounded-md hover:bg-green-700">Create User</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Page-specific JS -->
        <script th:inline="javascript">
            /* Modal helpers */
            function openModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) {
                    modal.classList.remove('hidden');
                    feather.replace(); // re-render icons inside modal
                }
            }
            function closeModal(modalId) {
                const modal = document.getElementById(modalId);
                if (modal) modal.classList.add('hidden');
            }

            /* Handle create user form via HTMX */
            document.getElementById('create-user-form').addEventListener('submit', function (e) {
                e.preventDefault();
                const formData = new FormData(this);
                const data = Object.fromEntries(formData);
                document.getElementById('create-user-spinner').classList.remove('hidden');

                fetch('/backoffice/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (localStorage.getItem('auth_token') || '')
                    },
                    body: JSON.stringify(data)
                })
                .then(function(response) {
                    return response.text().then(function(bodyText){
                        let body;
                        try { body = JSON.parse(bodyText); } catch(e){ body = { message: bodyText }; }
                        return { ok: response.ok, body: body, status: response.status };
                    });
                })
                .then(function(res) {
                    const messageArea = document.getElementById('create-user-message');
                    if(res.ok){
                        messageArea.innerHTML = '<div class="bg-green-50 border border-green-200 text-green-800 rounded-md p-4 text-sm">User created successfully</div>';
                        setTimeout(function () {
                            closeModal('create-user-modal');
                            htmx.trigger('#users-table-body', 'refresh');
                        }, 1000);
                    }else{
                        messageArea.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-800 rounded-md p-4 text-sm">' + (res.body.message || 'Error creating user') + '</div>';
                    }
                    messageArea.classList.remove('hidden');
                    document.getElementById('create-user-spinner').classList.add('hidden');
                })
                .catch(function() {
                    document.getElementById('create-user-message').innerHTML = '<div class="bg-red-50 border border-red-200 text-red-800 rounded-md p-4 text-sm">Network error. Please try again.</div>';
                    document.getElementById('create-user-message').classList.remove('hidden');
                    document.getElementById('create-user-spinner').classList.add('hidden');
                });
            });
        </script>
    </th:block>
</html>
